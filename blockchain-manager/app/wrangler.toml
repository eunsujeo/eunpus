name = "blockchain-manager"
compatibility_date = "2026-01-01"
pages_build_output_dir = "public"

# GITHUB_TOKEN 은 secret 으로만 관리 (dashboard 또는 wrangler pages secret put)
[vars]
GITHUB_OWNER = "eunsujeo"
GITHUB_REPO = "eunpus"
GITHUB_BRANCH = "main"
DOCS_PATH = "blockchain-manager/docs"

# 상태·순서 오버레이용 KV. 로컬은 `wrangler pages dev public --kv BOARD` 로 대체.
# 배포 시: `wrangler kv namespace create BOARD` 로 만든 id 를 아래에 넣거나
#          Pages 대시보드 Settings > Functions > KV bindings 에 BOARD 로 바인딩.
# [[kv_namespaces]]
# binding = "BOARD"
# id = "<KV_NAMESPACE_ID>"
