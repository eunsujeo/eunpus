openapi: 3.1.0
info:
  title: Blockchain Manager API
  version: "0.1.1"
  x-curl: true
  description: |
    블록체인 매니저는 사내의 별도 서비스로, 온체인 거래(노드 연동)를 담당한다.
    호출 쪽 백엔드(Service·Admin)는 이 HTTP API 로 계정·주소·잔액·거래를 다루고,
    온체인 상태 변경은 메시지 큐 이벤트로 받는다.

    아래 규약은 **모든 엔드포인트에 공통** 적용된다.

    ## 응답 형식

    성공·목록·에러 모두 같은 구조로 돌려준다. `meta.requestId` 로 요청을 추적한다.

    단일 리소스:

    ```json
    {
      "data": {
        "accountType": "CUSTOMER",
        "ref": "000123",
        "accountId": "acct_01H8X"
      },
      "meta": {
        "requestId": "3f9a1c2e-7b4d-4e2a-9c1f-0a2b3c4d5e6f"
      }
    }
    ```

    페이지네이션 목록:

    ```json
    {
      "data": [
        { "txId": "tx_9f2a", "status": "FINALIZED", "amount": "1.5" }
      ],
      "meta": {
        "requestId": "3f9a1c2e-7b4d-4e2a-9c1f-0a2b3c4d5e6f"
      },
      "pagination": {
        "nextCursor": "eyJsYXN0IjoxNzUxMzM2MDAwMDAwfQ",
        "hasMore": true
      }
    }
    ```

    에러:

    ```json
    {
      "error": {
        "code": "ACCOUNT_NOT_FOUND",
        "message": "account not found"
      },
      "meta": {
        "requestId": "3f9a1c2e-7b4d-4e2a-9c1f-0a2b3c4d5e6f"
      }
    }
    ```

    ## 데이터 포맷

    - **시각** — ISO 8601, UTC, 밀리초. 예: `2026-07-13T04:05:06.789Z`
    - **금액** — 문자열(decimal). 예: `"1.5"`. float 가 아니라 decimal 로 파싱한다.
    - **필드명** — camelCase (`externalTxId` · `numOfConfirmations`)
    - **요청 추적** — 모든 응답에 `meta.requestId`
    - **온체인 해시** — 전파 후 채워짐(그 전엔 null), `txHash`

    ## 에러 코드

    판단은 `error.code` 로 한다.

    | 코드 | HTTP | 뜻 |
    |---|---|---|
    | `VALIDATION_FAILED` | 400 | 요청 형식·값이 규약에 안 맞음 |
    | `ACCOUNT_NOT_FOUND` | 404 | 계정 없음 (주소 미발급과 구분) |
    | `ASSET_NOT_SUPPORTED` | 400 | 우리가 지원하지 않는 (네트워크, 토큰) — 요청 형식은 맞다 |
    | `NOT_FOUND` | 404 | 그 밖의 리소스 없음 |
    | `CONFLICT` | 409 | 같은 멱등 키에 다른 내용이 왔다 (예: 이미 쓴 externalTxId 로 금액·목적지가 다른 제출) |
    | `RELAY_REJECTED` | 502 | 대납 relay 가 전송을 못 대거나 거절 |
    | `INTERNAL` | 500 | 서버 내부 오류 |

    `INTERNAL`(500) 은 모든 엔드포인트에서 날 수 있어, 오퍼레이션별 응답 표기에서는 생략한다.

    ## 페이지네이션

    목록은 **커서 방식**이다. `limit`(기본 200, 최대 500)으로 크기를 정하고, 응답 `pagination.nextCursor` 를 다음 요청 `cursor` 로 넘겨 이어받는다. 지금 이어받을 페이지가 있는지는 `hasMore` 로 판단한다 — false 면 현재 시점 마지막 페이지다.

    `nextCursor` 는 **마지막 페이지에서도 항상 채워진다** — 이번 응답 마지막 항목의 다음 위치를 가리킨다. `order=asc` 조회에서는 이 커서를 보관했다가 나중에 같은 값으로 재요청하면 그 사이 새로 쌓인 내역만 이어받는다(증분 폴링). `order=desc`(기본, 최신순)는 커서가 과거 방향으로 진행하므로 페이지 순회용이다.

    `cursor`/`nextCursor` 는 **불투명 토큰**이라 파싱·구성 대상이 아니며, 받은 값을 그대로 전달한다(다음 위치·필터·정렬 방향이 토큰에 담겨 있다). 커서 요청에서는 첫 요청의 조회 조건이 토큰으로 이어지므로, 함께 보낸 다른 파라미터는 무시된다.

    ## 인증

    **없음 (2026-08-05 확정)** — 호출 쪽과 매니저는 내부망 경계를 신뢰한다. securitySchemes 를 정의하지 않는다.

    ## 멱등

    - **계정 생성** — `createAccount` 는 (`accountType`, `ref`) 로 멱등하다. 같은 값으로 재요청하면 매니저가 같은 결과를 돌려준다(호출 쪽이 별도 멱등키를 넣지 않는다).
    - **주소 발급** — `createDepositAddresses` 는 네트워크마다 `(accountId, network, token)` 로 멱등하다. 부분 실패해도 성공분은 남으므로 같은 요청을 그대로 재시도할 수 있다.
    - **출금 제출** — 본문 `externalTxId` 가 멱등 키다. **같은 키로 같은 내용을 재제출하면 처음의 `txId` 를 그대로 돌려준다** — 응답을 못 받아 재시도하는 경우가 정상 경로다. 같은 키인데 **내용이 다르면** `409 CONFLICT` 다. 어느 쪽이든 벤더로 중복 전송되지 않는다.

    ## 이벤트 (메시지 큐)

    온체인 상태 변경(입금 감지·출금 확정 등)은 이 HTTP API 가 아니라 **메시지 큐 이벤트**로 온다. 호출 쪽은 토픽별 컨슈머로 받는다.

    ```seq
    체인 -> Fireblocks: 온체인 상태 변경
    Fireblocks -> 매니저: 웹훅 알림 push (서명 검증 후 수신)
    매니저 -> 큐: publish (3 토픽)
    큐 -> 소비 쪽: consume
    소비 쪽 -> 원장: 반영 (멱등)
    소비 쪽 -> 큐: 오프셋 커밋
    ```

    | 토픽 | 담는 이벤트 | 파티션 키 |
    |---|---|---|
    | `deposit-events` | 고객 입금 (`DEPOSIT`) | 고객 accountId |
    | `withdrawal-events` | 외부 출금 (`WITHDRAWAL`) | 출금 풀 vault 의 accountId |
    | `internal-events` | 내부 이체 (`INTERNAL` — delta 정산만 · sweep 은 매니저 내부라 싣지 않는다) | 출발 계정 accountId |

    귀속 불명 입금(매핑에 없는 주소)은 큐에 싣지 않는다 — 별도 알림 채널로 통지된다.

    **ChainEvent** — 큐로 오는 이벤트 형태 (타입 [ChainEvent](#schema-ChainEvent)):

    ```json
    {
      "eventId": "0198c0de-7a2b-7c3d-8e4f-5a6b7c8d9e0f",
      "type": "WITHDRAWAL",
      "txId": "tx_9f2a",
      "txHash": "0x4e1d...ab",
      "externalTxId": "wd-260713-0042",
      "accountId": "acct_pool_02",
      "network": "ETHEREUM",
      "token": "USDC",
      "to": "0x9f...E2",
      "status": "FINALIZED",
      "numOfConfirmations": 12
    }
    ```

    - `eventId` — 이벤트 고유 id (UUID v7). **중복 제거 기준은 이 값 하나다**
    - [`type`](#schema-EventType) — DEPOSIT · WITHDRAWAL · INTERNAL
    - [`status`](#schema-TxStatus) — 공통 상태 다섯 (아래 "상태 (TxStatus) 기준"). 소비 쪽은 이것으로만 판단한다
    - `txHash` — 전파 후 채워짐
    - 벤더의 `subStatus`·`networkStatus` 는 이벤트에 싣지 않는다 — 매니저가 번역에 쓰는 내부 값이다

    전달 보장:

    - **at-least-once** — 같은 이벤트가 드물게 두 번 올 수 있다. **`eventId` 유일 기준으로 중복을 버린다** — 한 거래(txId)에서 감지·확정·실패 이벤트가 각각 오므로 `txId` 로 중복 제거하면 뒤 이벤트가 버려진다.
    - **오프셋 커밋** — 원장 반영이 성공한 뒤에만.
    - **순서** — 같은 계정은 파티션 키가 보장.
    - **입금 시작 상태** — 입금은 `SUBMITTED` 없이 `CONFIRMED` 부터 온다 (`SUBMITTED` 는 우리가 제출하는 거래에서만 관찰).
    - `REJECTED`(일시적) ≠ `FAILED`(영구). 확정(`FINALIZED`) 판정은 **매니저가** `numOfConfirmations` 를 체인별 임계와 비교해 내린다 — 컨슈머는 `status` 로만 판단한다.

    ## 상태 (TxStatus) 기준

    거래·이벤트의 `status` 는 이 다섯이 기준이다. 벤더 원어는 매니저가 이 다섯으로 번역한다. 아래 표의 `subStatus`·`networkStatus` 열은 **매니저가 번역에 쓰는 벤더 내부 값** — 이벤트에는 `status`(TxStatus) 만 싣는다.

    | 공통 상태 | 뜻 | 블록체인 상태 (Pending → Confirmed → Finalized) | 벤더(Fireblocks) 원어 | 대표 subStatus | networkStatus |
    |---|---|---|---|---|---|
    | `SUBMITTED` | 제출됨 — 서명·전파 준비 중, 아직 체인 미등장 (출금만 관찰) | 아직 없음 → 전파되면 Pending | PENDING_SIGNATURE · QUEUED · BROADCASTING | — | 서명 단계엔 없음 → BROADCASTING |
    | `CONFIRMED` | 전파 후 체인 등장, 컨펌 누적 중 (미확정) | Confirmed — 블록에 포함, finality 전 | CONFIRMING | PENDING_BLOCKCHAIN_CONFIRMATIONS | CONFIRMING |
    | `FINALIZED` | 확정 — 확정 정책(DCCP) 임계 컨펌 도달 | Finalized | COMPLETED | CONFIRMED | CONFIRMED |
    | `REJECTED` | 거부·차단 — 정책·스크리닝에 막힘. 영구 실패가 아니라 사람 개입 여지 | 출금 차단은 체인에 없음 · 입금 동결은 Finalized | REJECTED · BLOCKED | AUTO_FREEZE · FROZEN_MANUALLY · REJECTED_AML_SCREENING | 출금(전파 전 차단)은 없음 · 입금 동결은 CONFIRMED |
    | `FAILED` | 영구 실패 — 사유 동반 (수수료 부족·revert 등) | Pending 에서 증발 · revert 는 Confirmed 이후 | FAILED | DROPPED_BY_BLOCKCHAIN (reorg 증발) · 그 외 | FAILED (revert) · DROPPED (mempool 누락) |

    판단은 다섯(`status`)으로 한다. `REJECTED`(일시적) ≠ `FAILED`(영구) 구분이 원장·화면 처리를 가른다.

    이 다섯은 매니저와 호출 쪽 사이의 **계약 어휘**다 — 이 문서에 남아 있는 `CONFIRMING`·`COMPLETED` 표기는 전부 **벤더(Fireblocks) 원어**다.

    - ★ **`CONFIRMED` 는 미확정이다** — 벤더 subStatus/networkStatus 의 `CONFIRMED`(임계 도달, COMPLETED 동반)와 철자가 같지만 가리키는 단계가 다르다. 확정은 `FINALIZED` 다.
    - ★ **`FINALIZED` 는 체인 finality 가 아니다** — DCCP 정책 임계 도달일 뿐이고, `FINALIZED` → `FAILED`(reorg 증발, `DROPPED_BY_BLOCKCHAIN`) 전이가 존재한다. 상태에 서열을 매겨 "뒤로 가면 무시"로 구현하면 안 된다.
servers:
  - url: https://{baseUrl}/blockchain/manage-api
    description: 매니저 API 베이스 URL
    variables:
      baseUrl:
        default: api.example.com
tags:
  - name: Accounts
    description: 계정과 입금 주소
  - name: Balances
    description: 잔액 조회
  - name: Transactions
    description: 수수료 견적·출금 제출·거래 조회

paths:
  /accounts:
    post:
      tags: [Accounts]
      summary: 계정 생성
      description: |
        vault 를 만들고 `ref ↔ accountId` 매핑을 반환한다. `ref` 는 호출 쪽 계정 ID 를 그대로 쓴다.

        - (`accountType`, `ref`) 로 멱등하다 — 재요청하면 같은 `accountId` 를 돌려준다.
        - 고객·시스템(운영) 계정을 같은 오퍼레이션으로 만든다. **두 유형의 ID 는 값이 겹칠 수 있어 `accountType` 이 필수**다.
        - 매니저는 `ref` 를 불투명 문자열로 다루고 내용을 파싱해 분기하지 않는다.
      operationId: createAccount
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateAccountRequest' }
      responses:
        '201':
          description: 생성됨(또는 멱등 재요청)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountResponse' }
        '400': { $ref: '#/components/responses/ValidationFailed' }

  /accounts/{accountId}/addresses:
    parameters:
      - $ref: '#/components/parameters/AccountId'
    post:
      tags: [Accounts]
      summary: 입금 주소 여러 자산 한 번에 발급
      description: |
        한 토큰의 입금 주소를 여러 네트워크에 발급한다. `(accountId, network, token)` 로 **네트워크마다 멱등**하다.

        - 계정이 없으면 `404`. 지원하지 않는 네트워크가 **하나라도 섞이면 아무것도 발급하지 않고 `400`** 이다 — 지원 여부는 발급 전에 판별된다.
        - 발급을 시작한 뒤의 실패는 되돌리지 않는다(주소 발급은 취소할 수 없다). 항목의 `error` 에 담고 HTTP 는 `200` 이다.
        - 응답은 **요청과 같은 순서**다. 같은 요청을 그대로 재시도하면 이미 발급된 것은 벤더 호출 없이 같은 주소가 오고 실패분만 다시 시도된다.
        - 한 요청 **20네트워크**까지. 네트워크마다 벤더를 한 번 부른다.
        - 네트워크 목록은 호출 쪽이 정한다 — 매니저는 토큰만 받아 네트워크를 채우지 않는다.

        요청:

        ```json
        { "token": "USDC", "networks": ["ETHEREUM", "BASE"] }
        ```

        **전체 성공** (`200`):

        ```json
        {
          "data": [
            { "network": "ETHEREUM", "address": "0xAb3...C9", "memoTag": null, "error": null },
            { "network": "BASE",     "address": "0x9f4...E2", "memoTag": null, "error": null }
          ],
          "meta": { "requestId": "3f9a1c2e-7b4d-4e2a-9c1f-0a2b3c4d5e6f" }
        }
        ```

        **부분 실패** (`200`) — 성공분은 그대로 남는다. 같은 요청을 재시도하면 `BASE` 만 다시 시도된다:

        ```json
        {
          "data": [
            { "network": "ETHEREUM", "address": "0xAb3...C9", "memoTag": null, "error": null },
            { "network": "BASE", "address": null, "memoTag": null,
              "error": { "code": "INTERNAL", "message": "vendor call failed" } }
          ],
          "meta": { "requestId": "3f9a1c2e-7b4d-4e2a-9c1f-0a2b3c4d5e6f" }
        }
        ```

        **재시도** — 위 부분 실패 뒤에 **처음과 같은 요청을 그대로** 보낸다:

        ```json
        { "token": "USDC", "networks": ["ETHEREUM", "BASE"] }
        ```

        응답 (`200`) — 이미 발급된 `ETHEREUM` 은 **같은 주소**가 그대로 오고(매니저 DB 에서 찾아 돌려주므로 **벤더를 다시 부르지 않는다**), `BASE` 만 새로 시도된다:

        ```json
        {
          "data": [
            { "network": "ETHEREUM", "address": "0xAb3...C9", "memoTag": null, "error": null },
            { "network": "BASE",     "address": "0x9f4...E2", "memoTag": null, "error": null }
          ],
          "meta": { "requestId": "7c2b8d1a-4e6f-4a3b-9d5e-1f2a3b4c5d6e" }
        }
        ```

        실패한 네트워크만 골라 `{ "token": "USDC", "networks": ["BASE"] }` 로 보내도 결과는 같다 — 응답에 `BASE` 항목 하나만 담길 뿐이다. 어느 쪽이든 이미 발급된 주소가 바뀌지 않는다.

        **전체 실패** (`200`) — 발급은 시도했고 전부 실패했다. `400` 과 다르다:

        ```json
        {
          "data": [
            { "network": "ETHEREUM", "address": null, "memoTag": null,
              "error": { "code": "INTERNAL", "message": "vendor call failed" } },
            { "network": "BASE", "address": null, "memoTag": null,
              "error": { "code": "INTERNAL", "message": "vendor call failed" } }
          ],
          "meta": { "requestId": "3f9a1c2e-7b4d-4e2a-9c1f-0a2b3c4d5e6f" }
        }
        ```

        **발급 전 거절** (`400`) — 미지원 네트워크가 섞였다. **아무것도 발급되지 않았다**:

        ```json
        {
          "error": { "code": "ASSET_NOT_SUPPORTED", "message": "unsupported network for token: TRON/USDC" },
          "meta": { "requestId": "3f9a1c2e-7b4d-4e2a-9c1f-0a2b3c4d5e6f" }
        }
        ```
      operationId: createDepositAddresses
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateAddressesRequest' }
      responses:
        '200':
          description: 네트워크별 결과 (부분 성공 포함)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AddressesResponse' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '404': { $ref: '#/components/responses/AccountNotFound' }
    get:
      tags: [Accounts]
      summary: 발급된 입금 주소 조회
      description: |
        그 계정에 발급된 입금 주소를 돌려준다 — 매니저 DB 를 읽을 뿐 벤더 왕복이 없다.

        `token` · `network` 로 걸러 받을 수 있고 둘 다 없으면 그 계정의 전체다. 같은 토큰을 여러 네트워크로 받는 고객 화면은 `token` 하나만 걸어 한 번에 받는다.

        **미발급은 배열에 담기지 않는다** — 계정은 있는데 주소가 없으면 빈 배열이고, 계정 자체가 없으면 `404` 다. 발급(`POST`)과 경로가 같아 메서드만 다르다.
      operationId: depositAddressesOf
      parameters:
        - name: token
          in: query
          required: false
          schema: { type: string, maxLength: 16 }
          description: 토큰 심볼로 거른다 (선택)
          example: USDC
        - name: network
          in: query
          required: false
          schema: { type: string, maxLength: 20 }
          description: 네트워크 코드로 거른다 (선택)
          example: BASE
      responses:
        '200':
          description: 발급된 주소 목록 (미발급이면 빈 배열)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DepositAddressListResponse' }
        '404': { $ref: '#/components/responses/AccountNotFound' }

  /accounts/{accountId}/balances:
    parameters:
      - $ref: '#/components/parameters/AccountId'
    get:
      tags: [Balances]
      summary: vault 잔액 조회
      description: |
        벤더가 보는 **vault 잔액** — 대사 재료이지 고객별 귀속 잔액이 아니다.

        - `network` · `token` 으로 거른다. 둘 다 없으면 **그 계정에 주소가 발급된 자산 전부**다.
        - **주소 없이 vault 에 들어온 자산은 나오지 않는다** — 매니저가 아는 자산 집합이 발급 기록뿐이다.
        - 자산마다 벤더를 한 번 부른다.
      operationId: balancesOf
      parameters:
        - name: network
          in: query
          required: false
          schema: { type: string, maxLength: 20 }
          description: 네트워크 코드로 거른다 (선택)
          example: BASE
        - name: token
          in: query
          required: false
          schema: { type: string, maxLength: 16 }
          description: 토큰 심볼로 거른다 (선택)
          example: USDC
      responses:
        '200':
          description: 자산별 잔액 (해당 자산이 없으면 빈 배열)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AssetBalanceListResponse' }
        '404': { $ref: '#/components/responses/AccountNotFound' }

  /transactions:
    post:
      tags: [Transactions]
      summary: 출금 제출
      description: |
        출금(또는 내부 이체)을 제출한다. 응답은 벤더 tx id(`txId`)이고 상태 진행은 큐 이벤트로 따라간다(Events).

        - `externalTxId` 가 멱등 키다. **같은 키 + 같은 내용**을 다시 보내면 처음의 `txId` 를 돌려주므로 **재시도가 안전**하다.
        - 같은 키인데 **내용이 다르면** `409` 다.
        - 제출한 건은 `GET /transactions/external/{externalTxId}` 로 찾는다 — 출금은 출금 풀 vault 에서 나가 계정별 목록에는 없다.
      operationId: submitTransaction
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TransactionRequest' }
      responses:
        '202':
          description: 접수됨(제출)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SubmitResponse' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '409': { $ref: '#/components/responses/Conflict' }
        '502': { $ref: '#/components/responses/RelayRejected' }

  /transactions/external/{externalTxId}:
    parameters:
      - name: externalTxId
        in: path
        required: true
        schema: { type: string, maxLength: 128 }
        description: 제출할 때 실은 우리 요청 키
        example: wd-260713-0042
    get:
      tags: [Transactions]
      summary: 우리 요청 키로 거래 조회
      description: |
        `externalTxId` 로 제출한 건을 찾는다. 출금은 고객 계정이 아니라 **출금 풀 vault 에서 나가므로** 계정별 목록 조회로는 찾을 수 없다 — 호출 쪽이 자기 출금을 아는 유일한 키가 `externalTxId` 라 이 경로가 필요하다.

        제출 응답을 못 받았을 때의 확인, 그리고 대사에서 우리 기록과 벤더 기록을 잇는 데 쓴다.
      operationId: transactionByExternalTxId
      responses:
        '200':
          description: 조회 결과
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TransferResponse' }
        '404': { $ref: '#/components/responses/NotFound' }

  /transactions/{txId}:
    get:
      tags: [Transactions]
      summary: 거래 단건 조회
      description: 벤더 tx id(`txId`)로 거래 1건을 조회한다. `txId` 는 출금 제출 응답이나 큐 이벤트에서 얻는다.
      operationId: transactionOf
      parameters:
        - name: txId
          in: path
          required: true
          schema: { type: string }
          description: 벤더 tx id
          example: tx_9f2a
      responses:
        '200':
          description: 거래
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TransferResponse' }
        '404': { $ref: '#/components/responses/NotFound' }

  /accounts/{accountId}/transactions:
    parameters:
      - $ref: '#/components/parameters/AccountId'
    get:
      tags: [Transactions]
      summary: 거래 목록 조회
      description: |
        거래 이력을 **거래 시각(createdAt) 기준**으로 조회한다 — 기본 최신순, `order=asc` 면 과거→최신. 기간(`after`/`before`)·상태로 좁히고 커서로 페이지네이션한다.
        `order=asc` + `before` 생략 조합이면 마지막 `nextCursor` 를 보관했다가 재요청해 새로 쌓인 내역만 이어받는 증분 폴링이 된다.
        상태 변경 실시간 감지는 이 목록이 아니라 이벤트 큐가 담당한다(매니저의 웹훅 감지와 별개).
      operationId: transactionsOf
      parameters:
        - name: after
          in: query
          required: true
          schema: { type: string, format: date-time }
          description: 시작 시각 — 거래 시각(createdAt) 기준 (ISO 8601 UTC)
          example: "2026-07-01T00:00:00.000Z"
        - name: before
          in: query
          required: false
          schema: { type: string, format: date-time }
          description: 종료 시각 — 거래 시각(createdAt) 기준 (ISO 8601 UTC). 생략하면 상한 없음 — 증분 폴링(`order=asc`) 조회는 생략한다.
          example: "2026-07-13T00:00:00.000Z"
        - name: order
          in: query
          required: false
          schema: { type: string, enum: [asc, desc], default: desc }
          description: 정렬 방향 — 거래 시각(createdAt) 기준. 기본 desc(최신순). 마지막 커서를 보관해 새 내역을 이어받는 증분 폴링은 `asc` 조회에서만 성립한다.
          example: desc
        - name: status
          in: query
          required: false
          schema: { $ref: '#/components/schemas/TxStatus' }
          description: 상태 필터 (선택)
          example: FINALIZED
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 500, default: 200 }
          description: 페이지 크기 — 기본 200, 최대 500 (벤더 한도). 1 미만이거나 500 초과면 `400 VALIDATION_FAILED`.
          example: 200
        - name: cursor
          in: query
          required: false
          schema: { type: string }
          description: 다음 위치 커서 — 이전 응답의 `pagination.nextCursor` 를 그대로 넣는다. 불투명 토큰이라 직접 만들거나 해석하지 않는다. 첫 요청엔 생략. cursor 가 있으면 조회 조건은 토큰이 우선이라 함께 보낸 `after`/`before`·`status`·`order`·`limit` 는 무시된다.
          example: eyJsYXN0IjoxNzUxMzM2MDAwMDAwfQ
      responses:
        '200':
          description: 거래 목록
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TransfersResponse' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '404': { $ref: '#/components/responses/AccountNotFound' }

components:
  parameters:
    AccountId:
      name: accountId
      in: path
      required: true
      schema: { type: string, maxLength: 64 }
      description: 매니저가 돌려준 vault 핸들 (DB ext_acnt_id = vaultAccountId)
      example: acct_01H8X

  schemas:
    Meta:
      type: object
      properties:
        requestId:
          type: string
          description: 요청 추적 id (모든 응답에 포함)
          example: 3f9a1c2e-7b4d-4e2a-9c1f-0a2b3c4d5e6f
      required: [requestId]

    Pagination:
      type: object
      properties:
        nextCursor:
          type: string
          description: 다음 위치 커서 (불투명 토큰) — 다음 요청 `cursor` 로 그대로 전달. 마지막 페이지에서도 항상 채워지며, `order=asc` 조회면 보관해 뒀다가 이후 새로 쌓인 내역을 이어받는 시작점(증분 폴링)으로 쓴다.
          example: eyJsYXN0IjoxNzUxMzM2MDAwMDAwfQ
        hasMore: { type: boolean, description: 지금 이어받을 다음 페이지가 있는지 — false 면 현재 시점 마지막 페이지, example: true }
      required: [nextCursor, hasMore]

    ErrorBody:
      type: object
      properties:
        code:
          type: string
          description: 에러 코드 (API Conventions 표 참조)
          example: ACCOUNT_NOT_FOUND
        message:
          type: string
          description: 사람이 읽는 설명 — 분기 판단은 `code` 로 한다
          example: account not found
      required: [code, message]

    ErrorResponse:
      type: object
      properties:
        error: { $ref: '#/components/schemas/ErrorBody' }
        meta: { $ref: '#/components/schemas/Meta' }
      required: [error, meta]

    Account:
      type: object
      properties:
        accountType: { $ref: '#/components/schemas/AccountType' }
        ref: { type: string, maxLength: 64, description: "우리 참조 키 — 호출 쪽 계정 ID 그대로. 접두사는 붙지 않는다", example: "000123" }
        accountId: { type: string, description: "매니저가 돌려주는 vault 핸들 (DB ext_acnt_id = vaultAccountId)", example: acct_01H8X }
      required: [accountType, ref, accountId]

    Transfer:
      type: object
      description: 거래 1건. 요청의 `from`/`to`(TransferPeer)는 여기선 확정된 온체인 주소 문자열로 나온다.
      properties:
        txId: { type: string, description: 벤더 tx id }
        txHash:
          type: [string, "null"]
          description: 온체인 거래해시 — 전파 후 채워짐
        externalTxId:
          type: [string, "null"]
          description: 우리 요청 키
        network: { type: string, description: 네트워크 코드, example: ETHEREUM }
        token: { type: string, description: 토큰 심볼, example: USDC }
        amount: { type: string, description: 금액(문자열) }
        from: { type: string, description: 발신 (확정 온체인 주소) }
        to: { type: string, description: 목적지 (확정 온체인 주소) }
        status: { $ref: '#/components/schemas/TxStatus' }
        numOfConfirmations: { type: integer, description: 누적 컨펌 수 }
        createdAt: { type: string, format: date-time, description: 거래 생성 시각 (목록 정렬·기간 필터 기준) }
        lastUpdated: { type: string, format: date-time, description: 마지막 상태 변경 시각 }
      required: [txId, network, token, amount, from, to, status, numOfConfirmations, createdAt, lastUpdated]
      example:
        txId: tx_9f2a
        txHash: "0x4e1d...ab"
        externalTxId: wd-260713-0042
        network: ETHEREUM
        token: USDC
        amount: "1.5"
        from: "0xA1...C9"
        to: "0x9f...E2"
        status: FINALIZED
        numOfConfirmations: 12
        createdAt: "2026-07-13T04:05:06.789Z"
        lastUpdated: "2026-07-13T04:06:10.120Z"

    ChainEvent:
      type: object
      description: 큐로 오는 온체인 상태 변경 이벤트 (HTTP 응답이 아니라 메시지 큐로 전달).
      properties:
        eventId: { type: string, format: uuid, description: 이벤트 고유 id (UUID v7) — 컨슈머 중복 제거 기준 }
        type: { $ref: '#/components/schemas/EventType' }
        txId: { type: string, description: 벤더 tx id }
        txHash: { type: [string, "null"], description: 온체인 거래해시 — 전파 후 채워짐 }
        externalTxId: { type: [string, "null"], description: 우리 요청 키 (출금·내부이체) }
        accountId: { type: string, description: "파티션 키 (vault 핸들)" }
        network: { type: string, description: 네트워크 코드, example: ETHEREUM }
        token: { type: string, description: 토큰 심볼, example: USDC }
        to: { type: string, description: 목적지 주소 — 입금 판별 }
        status: { $ref: '#/components/schemas/TxStatus' }
        numOfConfirmations: { type: integer, description: 누적 컨펌 수 }
      required: [eventId, type, txId, accountId, network, token, to, status, numOfConfirmations]
      example:
        eventId: 0198c0de-7a2b-7c3d-8e4f-5a6b7c8d9e0f
        type: WITHDRAWAL
        txId: tx_9f2a
        txHash: "0x4e1d...ab"
        externalTxId: wd-260713-0042
        accountId: acct_pool_02
        network: ETHEREUM
        token: USDC
        to: "0x9f...E2"
        status: FINALIZED
        numOfConfirmations: 12

    TxStatus:
      type: string
      enum: [SUBMITTED, CONFIRMED, FINALIZED, REJECTED, FAILED]
      description: 공통 상태 다섯 — 매니저와 호출 쪽 사이의 계약 어휘 (벤더 원어와 구분).
      x-enumDescriptions:
        SUBMITTED: 제출 — 체인 미등장
        CONFIRMED: 체인 등장·컨펌 누적 (미확정 — 확정은 FINALIZED)
        FINALIZED: 확정 — DCCP 임계 도달 (체인 finality 아님 — reorg 시 FAILED 전이 존재)
        REJECTED: 거부·차단 (일시적)
        FAILED: 영구 실패

    AccountType:
      type: string
      enum: [CUSTOMER, SYSTEM]
      description: 계정 유형 — `ref` 가 어느 ID 공간의 값인지 가린다. 접두사가 없어 두 유형의 ID 값이 겹칠 수 있다.
      x-enumDescriptions:
        CUSTOMER: 고객 계정
        SYSTEM: 시스템(운영) 계정
      example: CUSTOMER

    EventType:
      type: string
      enum: [DEPOSIT, WITHDRAWAL, INTERNAL]
      description: 이벤트 분류. 매니저가 발신자가 우리 vault 인지로 가른다. 귀속 불명 입금은 큐 대신 별도 알림 채널로 통지된다.
      x-enumDescriptions:
        DEPOSIT: 고객 입금 (매핑된 주소로 수신)
        WITHDRAWAL: 외부 출금
        INTERNAL: 내부 이체 — delta 정산 (sweep 은 매니저 내부 처리라 이벤트에 실리지 않는다)

    SubmitResult:
      type: object
      properties:
        txId: { type: string, description: 벤더 tx id, example: tx_9f2a }
      required: [txId]

    CreateAccountRequest:
      type: object
      required: [accountType, ref]
      properties:
        accountType: { $ref: '#/components/schemas/AccountType' }
        ref:
          type: string
          maxLength: 64
          description: 우리 참조 키 — 호출 쪽 계정 ID 그대로. 접두사가 붙지 않으므로 `accountType` 과 짝이어야 유일하다. 자리수·형식은 호출 쪽 규칙을 따른다. 초과 시 `400 VALIDATION_FAILED`.
          example: "000123"

    TransactionRequest:
      type: object
      properties:
        externalTxId:
          type: string
          maxLength: 128
          description: 우리 요청 키 — 승인 완료된 출금 지시 1건과 1:1. 재제출 중복 차단·완료 대응. 초과 시 `400 VALIDATION_FAILED`.
          example: wd-260713-0042
        from:
          allOf:
            - { $ref: '#/components/schemas/TransferPeer' }
            - properties: { type: { const: ACCOUNT } }
          description: 보내는 쪽 — type=ACCOUNT 만 허용
        to:
          allOf: [{ $ref: '#/components/schemas/TransferPeer' }]
          description: 목적지
        network: { type: string, description: 네트워크 코드, example: ETHEREUM }
        token: { type: string, description: 토큰 심볼, example: USDC }
        amount:
          type: string
          description: 금액(문자열 · 부동소수 금지)
          example: "1.5"
        note:
          type: [string, "null"]
          description: 벤더 거래 기록 메모
        travelRule:
          description: 트래블룰 게이트가 만든 암호화 산출물 — 해외(Notabene) 출금만 싣고, 국내(VerifyVASP)·개인지갑은 null
          oneOf:
            - { $ref: '#/components/schemas/TravelRule' }
            - { type: "null" }
      required: [externalTxId, from, to, network, token, amount]
      example:
        externalTxId: wd-260713-0042
        from: { type: ACCOUNT, accountId: acct_pool_02 }
        to: { type: ADDRESS, address: "0x9f...E2" }
        network: ETHEREUM
        token: USDC
        amount: "1.5"
        note: null
        travelRule: null

    TransferPeer:
      type: object
      description: 벤더 TransferPeerPath 대응. from·to 공통. type 에 따라 필요한 식별 필드가 정해진다.
      properties:
        type: { $ref: '#/components/schemas/PeerType' }
        address:
          type: [string, "null"]
          description: 온체인 주소 (type=ADDRESS 일 때 필수)
        accountId:
          type: [string, "null"]
          description: 우리 계정 (type=ACCOUNT 일 때 필수)
        walletId:
          type: [string, "null"]
          description: 사전 등록 지갑 id (type=WHITELISTED 일 때 필수)
      required: [type]
      allOf:
        - if: { properties: { type: { const: ADDRESS } } }
          then: { required: [address] }
        - if: { properties: { type: { const: ACCOUNT } } }
          then: { required: [accountId] }
        - if: { properties: { type: { const: WHITELISTED } } }
          then: { required: [walletId] }

    PeerType:
      type: string
      enum: [ADDRESS, ACCOUNT, WHITELISTED]
      x-enumDescriptions:
        ADDRESS: 온체인 주소 (외부 출금 → ONE_TIME_ADDRESS)
        ACCOUNT: 우리 계정 (내부 이동 → VAULT_ACCOUNT)
        WHITELISTED: 사전 등록 지갑 (→ EXTERNAL_WALLET)

    TravelRule:
      type: object
      description: |
        트래블룰 게이트가 만든 **암호화 산출물**이다. 이 API(매니저)는 운반만 하고
        내용을 파싱하지 않으므로, 여기서는 내부 구조를 펼치지 않고 불투명한 객체로 둔다.

        - 실제 구조의 기준은 **IVMS101 표준 + 트래블룰 솔루션 스펙**(게이트 쪽 문서)이다.
        - 시나리오별로 실림 여부가 다르다 — 해외(Notabene)=메시지 있음, 국내(VerifyVASP)·개인지갑=없음(`null`).
        - 컴플라이언스가 내보내는 `travelRuleMessage`(암호화 문자열)를 호출 쪽이 이 필드로 실어 보낸다 — 정확한 형태는 구현 때 확정.
      additionalProperties: true

    AccountResponse:
      type: object
      properties:
        data: { $ref: '#/components/schemas/Account' }
        meta: { $ref: '#/components/schemas/Meta' }
      required: [data, meta]

    CreateAddressesRequest:
      type: object
      required: [token, networks]
      properties:
        token: { type: string, maxLength: 16, description: 토큰 심볼 — 이 요청의 모든 네트워크에 공통, example: USDC }
        networks:
          type: array
          minItems: 1
          maxItems: 20
          description: 주소를 받을 네트워크 1~20개. 빈 배열·초과는 `400 VALIDATION_FAILED`. 같은 네트워크가 두 번 들어오면 발급은 한 번만 하고 두 항목에 같은 결과를 담는다.
          items: { type: string, maxLength: 20, description: 네트워크 코드, example: ETHEREUM }

    AssetBalance:
      type: object
      description: 자산 하나의 vault 잔액. 세 칸으로 접어 돌려준다.
      required: [network, token, available, pending, locked]
      properties:
        network: { type: string, example: BASE }
        token: { type: string, example: USDC }
        available: { type: string, description: 가용 — 지금 출금에 쓸 수 있는 잔액, example: "10.5" }
        pending: { type: string, description: 대기 — 들어왔지만 확정 전, example: "1.0" }
        locked: { type: string, description: 잠김 — 나가는 중이거나 정책상 묶인 분 (벤더 lockedAmount + frozen), example: "0.3" }

    AssetBalanceListResponse:
      type: object
      properties:
        data:
          type: array
          description: 자산별 잔액 — 요청 필터에 걸린 것만
          items: { $ref: '#/components/schemas/AssetBalance' }
        meta: { $ref: '#/components/schemas/Meta' }
      required: [data, meta]

    DepositAddress:
      type: object
      description: 발급된 입금 주소 하나.
      required: [network, token, address]
      properties:
        network: { type: string, example: BASE }
        token: { type: string, example: USDC }
        address: { type: string, description: 온체인 입금 주소, example: "0xAb3...C9" }
        memoTag:
          oneOf:
            - { type: string }
            - { type: "null" }
          description: 체인이 요구하는 태그·메모 — EVM 은 null

    DepositAddressListResponse:
      type: object
      properties:
        data:
          type: array
          description: 발급된 주소 목록 — 미발급은 담기지 않는다
          items: { $ref: '#/components/schemas/DepositAddress' }
        meta: { $ref: '#/components/schemas/Meta' }
      required: [data, meta]

    AddressResult:
      type: object
      description: 네트워크 하나의 결과 — 성공이면 `address`, 실패면 `error` 가 채워진다 (둘 중 하나만).
      required: [network]
      properties:
        network: { type: string, example: ETHEREUM }
        address:
          oneOf:
            - { type: string }
            - { type: "null" }
          description: 발급된 주소 — 실패 시 null
          example: "0xAb3...C9"
        memoTag:
          oneOf:
            - { type: string }
            - { type: "null" }
          description: 체인이 요구하는 태그·메모 — EVM 은 null
        error:
          oneOf:
            - { $ref: '#/components/schemas/ErrorBody' }
            - { type: "null" }
          description: 실패 사유 — 성공 시 null. 코드 체계는 공통 에러 코드 표와 같다

    AddressesResponse:
      type: object
      properties:
        data:
          type: array
          description: 요청과 같은 순서의 네트워크별 결과
          items: { $ref: '#/components/schemas/AddressResult' }
        meta: { $ref: '#/components/schemas/Meta' }
      required: [data, meta]

    TransferResponse:
      type: object
      properties:
        data: { $ref: '#/components/schemas/Transfer' }
        meta: { $ref: '#/components/schemas/Meta' }
      required: [data, meta]

    TransfersResponse:
      type: object
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Transfer' }
        meta: { $ref: '#/components/schemas/Meta' }
        pagination: { $ref: '#/components/schemas/Pagination' }
      required: [data, meta, pagination]

    SubmitResponse:
      type: object
      properties:
        data: { $ref: '#/components/schemas/SubmitResult' }
        meta: { $ref: '#/components/schemas/Meta' }
      required: [data, meta]

  responses:
    ValidationFailed:
      description: 요청 검증 실패
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example:
            error: { code: VALIDATION_FAILED, message: "amount must be a decimal string" }
            meta: { requestId: 3f9a1c2e-7b4d-4e2a-9c1f-0a2b3c4d5e6f }
    NotFound:
      description: 리소스 없음
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example:
            error: { code: NOT_FOUND, message: "transaction not found" }
            meta: { requestId: 3f9a1c2e-7b4d-4e2a-9c1f-0a2b3c4d5e6f }
    AccountNotFound:
      description: 계정 없음
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example:
            error: { code: ACCOUNT_NOT_FOUND, message: "account not found" }
            meta: { requestId: 3f9a1c2e-7b4d-4e2a-9c1f-0a2b3c4d5e6f }
    Conflict:
      description: 상태·멱등 충돌
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example:
            error: { code: CONFLICT, message: "externalTxId already used" }
            meta: { requestId: 3f9a1c2e-7b4d-4e2a-9c1f-0a2b3c4d5e6f }
    RelayRejected:
      description: relay 가 전송을 대지 못함·거절 (대납 구성)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example:
            error: { code: RELAY_REJECTED, message: "relay refused to sponsor gas" }
            meta: { requestId: 3f9a1c2e-7b4d-4e2a-9c1f-0a2b3c4d5e6f }
