notes: |
  Emergency block of all workspace activity during security breach.
  Freeze actors: Owner / Admin / Non-Signing Admin / Security Admin (4 Admin-level roles).
  All users (including Owner) become Viewer; incoming transfers still received.
  Unfreeze: Owner only, requires Fireblocks Support request.
  Settings > General > Freeze workspace.
