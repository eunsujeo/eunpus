notes: |
  Per-chain minimum transaction amounts due to underlying blockchain limitations.
  Listed: BTC/BCH/LTC 0.00000582, ALGO 1e-6, ADA 1, DOGE 0.01, TON 1e-6.
  Other chains: based on token decimal limit (via Fireblocks API).
  Failures display "Amount Too Small".
