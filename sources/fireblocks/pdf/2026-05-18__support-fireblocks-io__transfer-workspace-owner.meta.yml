notes: |
  Fireblocks Help Center article "Transfer workspace Owner".
  Requires Fireblocks Support (cannot be done via Console).
  Preconditions: new Owner has Admin or Signer role, fully onboarded (MPC key
  shares generated), active Policies allow new Owner to sign.
  Both Owners verify identity via video call; new Owner verifies recovery passphrase.
  Workspace Keys Backup decision (keep/destroy) before transfer.
  Owner absence path: board resolution via stakeholder quorum.
  SLA: 3–5 business days.
