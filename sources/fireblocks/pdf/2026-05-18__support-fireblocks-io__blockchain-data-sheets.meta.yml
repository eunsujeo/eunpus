notes: |
  Standard metadata template for newly-supported chains.
  Fields: name, support since, description, native asset, mainnet/testnet explorers,
  supported functionality, finality, max confirmations, gas station defaults, importing private keys
  (chain ID, address prefix), token support, globally supported assets, minimum balance, supported networks.
  Currently lists Zigchain and Pocket Network (both Cosmos SDK, January 2026).
