notes: |
  Security best practices hub. 6 categories: Basic security (user roles, Admin Quorum),
  Transaction security (Policies, Deposit Control and Confirmation Policy, AML Transaction
  Screening Policy), Authentication (User login IP whitelisting [Support enable], SSO),
  Backup and Recovery (Auto-passphrase [Support enable]), Other (cooling-off period,
  Emergency freeze, Security audit log), API + Co-Signer best practices.
  References FSPM (Fireblocks Security Posture Management).
