notes: |
  Fireblocks Help Center article "Add API users".
  Two-step procedure: CSR generation (RSA 4096) + Console creation.
  API users use same user roles as Console users.
  Approval flow same as Console user add (Owner + Admin Quorum).
  Co-signer pairing options including Fireblocks Communal Test Co-signer (testnet)
  and SGX Co-signer "First user on this machine".
