notes: |
  Internal transactions = native asset transfers executed by smart contracts during tx execution (not standalone tx, no separate hash).
  Fireblocks notifies on direct native transfers (all EVM) and internal transfers (subset).
  Lists ~35 mainnets + ~24 testnets with internal-tx notification support.
  "Implementation choice, not chain limitation."
