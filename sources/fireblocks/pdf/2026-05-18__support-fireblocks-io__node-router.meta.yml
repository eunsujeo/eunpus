notes: |
  Premium feature, Customer Success Manager enablement.
  Two scenarios: Static dedicated route (single node, all outgoing tx) / On-demand route (per-tx via API).
  Restrictions: single node for static / EVM-only / used for tx prep & submission only.
  No fallback to Fireblocks default node. Customer responsible for maintenance.
