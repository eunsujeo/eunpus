notes: |
  Fireblocks Help Center article "Configure SSO".
  IdPs supported via self-setup: Google Workspace, Microsoft Entra ID, Okta,
  OpenID Connect, PingFederate, SAML 2.0/3.0.
  IdPs via Fireblocks Support: ADFS, LDAP / Active Directory.
  SSO authorizes by email domain. SSO only affects login authorization;
  user add/remove still done in Console.
  Auth0 acts as service provider. Callback URL: https://auth.fireblocks.io/login/callback.
  Changing SSO provider requires workspace Owner approval (via Support).
