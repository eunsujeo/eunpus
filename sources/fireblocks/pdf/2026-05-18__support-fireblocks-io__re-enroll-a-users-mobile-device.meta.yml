notes: |
  Fireblocks Help Center article "Re-enroll a user's mobile device".
  Triggers: biometric change, app uninstall, new device install, 6-digit PIN loss.
  Linked users / linked workspaces model: each must be re-enrolled separately.
  Signing-role user: Owner's MPC key share re-approval within 2 days; user's
  MPC registration within 2 days after that.
  Owner's own device re-enroll requires Fireblocks Support (even if Owner of a
  different workspace).
