notes: |
  Fireblocks Help Center article "Re-enrolling API users".
  Re-enroll triggers: initial Co-signer setup errors, pair with new/existing
  Co-signer, Callback Handler config change (e.g., switching auth method).
  Pairing token 1-hour validity.
  Troubleshooting: pairing token expiry, Callback Handler SSL cert mismatch
  (pinned public key).
