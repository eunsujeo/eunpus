notes: |
  XRP trust line removal conditions: reserve balance 0.2 XRP + default flag values.
  Fireblocks auto-creates trust lines with default flags via tokenization engine.
  If wallet balance falls below min reserve (1 XRP base + 0.2 XRP/trust line), trust lines may be auto-deleted on-chain.
  Min 1 XRP for base wallet independent of trust lines.
