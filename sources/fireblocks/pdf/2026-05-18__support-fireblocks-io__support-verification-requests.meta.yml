  Support agent initiates additional verification for sensitive workspace ops (e.g., account recovery).
  Flow: Mobile app notification -> PIN read-back (if displayed) -> biometric.
  Gradually rolled out; may not be available to all customers yet.
  Unexpected request -> reject + report to Fireblocks Support.
