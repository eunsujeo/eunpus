notes: |
  Labs feature, Owner-only enablement (Settings > Workspaces > Labs).
  Batch Approvals (v3.4.0+) + Batch Signing (v3.5.0+).
  Max 10 requests/batch. Same workspace, same user, no risk-flagged.
  PIN once + biometric (1x approval-only/signing-only, 2x mixed).
  Cancel on 1st biometric: full cancel. On 2nd: signing only canceled.
  Long processing tag for multi-input transfers.
  Failed requests -> Console re-initiate.
  Keep app open during processing.
