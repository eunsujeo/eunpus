notes: |
  Mobile app's two primary purposes: tx approval/signing and MPC-CMP key share host.
  Secure enclave, hardware-encrypted, no iCloud/Google Cloud backup.
  Three impossibilities: iCloud restore, uninstall+reinstall self-recovery, new biometric ID.
  Owner uninstall requires Key Share Recovery.
  API Co-Signer is alternative for automation.
