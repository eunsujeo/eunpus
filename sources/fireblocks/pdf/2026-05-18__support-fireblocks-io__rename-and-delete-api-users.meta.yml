notes: |
  Fireblocks Help Center article "Rename and delete API users".
  Rename: reversible, API key unchanged, Owner + Admin Quorum approval.
  Delete: default Owner-only, immediate, no mobile approval.
  Side effects: API key invalid, in-flight tx fail, Co-signer pairing retained
  (unpairing is separate), audit logs preserved, API user list retains entry.
  Approval group delegation reuses same Delete users permission as Console users.
