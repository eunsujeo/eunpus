title: "람다256, 케이뱅크·케이에스넷과 디지털자산 정산 오프램프·AML 검증 프로젝트 착수"
key_facts: |
  - 람다256 + 케이뱅크 + 케이에스넷(KSNET) 3사, 디지털자산 오프램프 PoC 착수. 약 5개월. 토큰 = USDC
  - 역할: 케이뱅크 = FX 적용·원화 지급·AML/STR 운영 / KSNET = 결제 인프라·가맹점 원화 정산·실물 운영 정책 / 람다256 = SCOPE (온체인 정산) + CLAIR (온체인 컴플라이언스)
  - 검증 흐름: 결제 시점 FX → 대금 정산 요청 생성 → AML·FDS 검증 → 지급 승인 → 온체인 정산 실행 → 원화 지급 → 거래 모니터링·STR
  - 운영체계: 기관 간 역할 분담·컴플라이언스·감사 대응·정책 유연성 점검
  - 지갑·키 관리 상세는 기사에 없음
