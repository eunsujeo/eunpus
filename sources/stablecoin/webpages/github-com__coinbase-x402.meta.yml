key_facts: |
  - HTTP 402 Payment Required 상태 코드 기반 결제 표준. Coinbase 개발 → x402 Foundation 으로 거버넌스 이전, 오픈 스탠다드
  - 흐름: 요청 → 402 + PAYMENT-REQUIRED 헤더 (PaymentRequirements) → 클라이언트가 PaymentPayload 서명 → PAYMENT-SIGNATURE 헤더 재요청 → 검증·정산 → PAYMENT-RESPONSE
  - scheme = 자금 이동의 논리 방식 (첫 공식 scheme 은 exact — 정확한 금액), 네트워크별 구현
  - facilitator = 검증(/verify)·정산(/settle) 대행 — 다중 네트워크 (EVM·SVM·Stellar)
  - 신뢰 모델: facilitator·서버는 클라이언트가 서명한 의도 범위 내에서만 자금 이동 가능 (trust minimizing)
