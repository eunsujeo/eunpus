title: "람다256, 여신금융협회·9개 카드사와 스테이블코인 결제·정산 PoC 완료"
key_facts: |
  - 2026-07-24 발표. 람다256 (두나무 자회사) + 여신금융협회 + 9개 카드사 (사명 미공개) 공동 PoC 완료
  - 검증 범위: 스테이블코인 발행·분배 → 결제 승인·취소·환불 → 정산 → 정책지원금·카드포인트 활용 → 온체인 AML·FDS 까지 카드 결제 전 과정
  - 사용 플랫폼: SCOPE (디지털자산 오케스트레이션) + CLAIR (온체인 컴플라이언스)
  - 월렛 구조·키 관리 상세는 기사에 없음
  - 상용화는 법·제도 정비 + 금융당국 정책 + 카드업계 전략에 따라 결정. 람다256 은 법제화 과정 기술 지원 지속
context: |
  컨퍼런스 세션 "스테이블코인 PoC 사례를 통해 보는 스테이블코인 결제 월렛의 보안" (람다256) 의
  배경 자료로 수집 (2026-08-20). 세션 본편은 이 PoC 의 월렛 보안 관점 상세를 다룰 것으로 예상.
