title: "Agents that transact: Introducing Amazon Bedrock AgentCore payments, built with Coinbase and Stripe"
key_facts: |
  - 2026-05-07 발표, Amazon Bedrock AgentCore payments (프리뷰: US East/US West/Frankfurt/Sydney)
  - AI 에이전트가 execution loop 안에서 API·웹 콘텐츠·MCP 서버에 실시간 직접 결제
  - 파트너: Coinbase (x402 프로토콜 + 지갑 인프라) / Stripe (Privy 지갑)
  - 결제 수단: 스테이블코인 (법정화폐는 로드맵, 프리뷰 미지원). 지갑은 Coinbase / Stripe Privy 중 선택
  - 통제: 세션별 지출 한도 + 명시적 사용자 승인 필수 + AgentCore 인프라 레이어 강제 (에이전트 우회 불가) + 트랜잭션 로그
